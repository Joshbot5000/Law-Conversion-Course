<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watson Glaser Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: an assessment booklet. Passage on a paper panel at left, answer sheet at right; one column on phones. */
:root {
  --bg: #edf0f4;
  --surface: #ffffff;
  --sunk: #f5f7fa;
  --ink: #16202c;
  --muted: #5a6676;
  --rule: #d3dae3;
  --accent: #29477a;
  --accent-ink: #ffffff;
  --accent-soft: #e2e9f4;
  --tape: #b23c66;
  --ok: #1d7448;
  --ok-soft: #e0f1e7;
  --bad: #b02a1d;
  --bad-soft: #fbe6e3;
  --warn: #8f5b00;
  --warn-soft: #fbefd6;
  --shadow: 0 1px 2px rgba(22, 32, 44, .06), 0 4px 16px rgba(22, 32, 44, .05);
  --f-display: "Libre Caslon Text", "Iowan Old Style", Georgia, serif;
  --f-read: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-ui: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #161d27; --sunk: #121821; --ink: #e4e9ef; --muted: #9aa5b3; --rule: #293341;
    --accent: #95b3e8; --accent-ink: #0e131a; --accent-soft: #1d2a3f; --tape: #e88aab;
    --ok: #5cc690; --ok-soft: #12301f; --bad: #f2897e; --bad-soft: #3a1612; --warn: #e3b14e; --warn-soft: #33260c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d27; --sunk: #121821; --ink: #e4e9ef; --muted: #9aa5b3; --rule: #293341;
  --accent: #95b3e8; --accent-ink: #0e131a; --accent-soft: #1d2a3f; --tape: #e88aab;
  --ok: #5cc690; --ok-soft: #12301f; --bad: #f2897e; --bad-soft: #3a1612; --warn: #e3b14e; --warn-soft: #33260c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
.mark .tape { width: 6px; height: 28px; background: var(--tape); border-radius: 2px; transform: skewX(-12deg); }
.mark b { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .01em; }
.mark small { display: block; font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
nav.top { display: flex; gap: 4px; flex-wrap: wrap; }
nav.top a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: .95rem; padding: 6px 10px; border-radius: 8px; }
nav.top a[aria-current="page"] { color: var(--ink); background: var(--accent-soft); }

main { padding-block: 28px 64px; }
.eyebrow { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); max-width: 62ch; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--rule); background: var(--surface); padding: 9px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: start; margin-bottom: 32px; }
.hero h1 { font-family: var(--f-display); font-size: clamp(1.8rem, 3.6vw, 2.6rem); line-height: 1.12; margin: 6px 0 12px; }
.facts { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
.facts h2 { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.facts dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 12px; }
.facts dt { font-family: var(--f-num); font-size: .95rem; font-variant-numeric: tabular-nums; }
.facts dd { margin: 0; color: var(--muted); }
.facts p { margin: 0; font-size: .88rem; color: var(--muted); }
.mixbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 6px 0 4px; }
.mixbar span { display: block; height: 100%; }
.mixkey { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
.mixkey i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }

.settings { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; padding: 14px 18px; background: var(--sunk); border: 1px solid var(--rule); border-radius: 12px; margin-bottom: 24px; }
.settings .lbl { font-size: .85rem; color: var(--muted); font-weight: 600; margin-right: 8px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: .9rem; color: var(--muted); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 28px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { font-family: var(--f-display); font-size: 1.25rem; display: flex; align-items: baseline; gap: 10px; }
.card h3 .n { font-family: var(--f-num); font-size: .78rem; color: var(--muted); font-weight: 500; }
.card p { margin: 0; color: var(--muted); font-size: .95rem; flex: 1; }
.stat { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { flex: 1; height: 6px; background: var(--sunk); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.card .acts { display: flex; gap: 8px; }
.card .acts .btn { flex: 1; }

.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.mode { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mode.feature { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mode h3 { font-size: 1.05rem; }
.mode p { margin: 0 0 6px; color: var(--muted); font-size: .93rem; flex: 1; }

/* ---------- question ---------- */
.qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.qcount { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .92rem; }
.timer { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.timer .clock { font-family: var(--f-num); font-size: 1.15rem; font-variant-numeric: tabular-nums; min-width: 4.2ch; text-align: right; }
.timer.low .clock { color: var(--bad); }
.timebar { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; margin-bottom: 18px; }
.timebar i { display: block; height: 100%; background: var(--accent); transition: width .2s linear; }
.timebar.low i { background: var(--bad); }

.qgrid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.paper { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 22px 24px; box-shadow: var(--shadow); position: relative; min-width: 0; }
.paper::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tape); opacity: .55; }
.paper .ptag { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
.paper .text { font-family: var(--f-read); font-size: 1.08rem; line-height: 1.65; }
.paper .text p { margin: 0 0 .6em; }
.paper ul.premises { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.paper ul.premises li { font-family: var(--f-read); font-size: 1.08rem; padding-left: 14px; border-left: 2px solid var(--rule); }
.paper .question { font-family: var(--f-read); font-weight: 600; font-size: 1.15rem; }
.answer { min-width: 0; }
.answer .ptag { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.statement { font-family: var(--f-read); font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin: 0 0 16px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); cursor: pointer; font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt kbd { font-family: var(--f-num); font-size: .78rem; color: var(--muted); border: 1px solid var(--rule); border-radius: 5px; padding: 1px 6px; background: var(--sunk); }
.opt:disabled { cursor: default; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .tag { margin-left: auto; font-size: .78rem; font-weight: 700; }
.opt.right .tag { color: var(--ok); }
.opt.wrong .tag { color: var(--bad); }

/* ---------- feedback ---------- */
.fb { margin-top: 18px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); overflow: hidden; }
.fb .verdict { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; font-weight: 600; }
.fb.ok .verdict { background: var(--ok-soft); color: var(--ok); }
.fb.bad .verdict { background: var(--bad-soft); color: var(--bad); }
.fb.late .verdict { background: var(--warn-soft); color: var(--warn); }
.fb .verdict .sub { color: var(--muted); font-weight: 500; font-size: .9rem; }
.fb .body { padding: 14px 16px 16px; display: grid; gap: 12px; }
.fb h4 { margin: 0; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fb p { margin: 0; }
.fb .contrast { padding: 10px 12px; background: var(--warn-soft); border-radius: 8px; color: var(--ink); }
.fb ol, .fb ul { margin: 0; padding-left: 1.25em; display: grid; gap: 6px; }
.fb ul.checks { list-style: none; padding: 0; }
.fb ul.checks li { padding: 6px 10px; border-radius: 8px; background: var(--sunk); font-size: .95rem; }
.fb ul.checks li.x { background: var(--bad-soft); }
.fb .rule { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.fb .rule b { display: block; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.fb .next { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

/* ---------- learn ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 22px; }
.tabs a { text-decoration: none; padding: 7px 14px; border: 1px solid var(--rule); border-radius: 999px; color: var(--muted); font-weight: 600; background: var(--surface); }
.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.guide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.guide section { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 20px 22px; min-width: 0; }
.guide h2 { font-family: var(--f-display); font-size: 1.5rem; margin-bottom: 8px; }
.guide h3 { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.guide p, .guide li { max-width: 65ch; }
.guide ol, .guide ul { padding-left: 1.2em; margin: 0; display: grid; gap: 6px; }
.scale { display: grid; gap: 6px; margin: 4px 0; }
.scale div { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; padding: 8px 10px; background: var(--sunk); border-radius: 8px; }
.scale b { font-weight: 700; }
.tablewrap { overflow-x: auto; }
table.cheat { border-collapse: collapse; width: 100%; font-size: .95rem; }
table.cheat th, table.cheat td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.cheat th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ok-t { color: var(--ok); font-weight: 700; }
.bad-t { color: var(--bad); font-weight: 700; }
.example .stmt { border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 12px; }
.example .stmt p { font-family: var(--f-read); font-weight: 600; margin: 0 0 8px; }
details.reveal summary { cursor: pointer; color: var(--accent); font-weight: 600; }
details.reveal[open] summary { margin-bottom: 8px; }

/* ---------- results / progress ---------- */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 6px 0 18px; }
.score .big { font-family: var(--f-display); font-size: clamp(2.6rem, 7vw, 3.6rem); line-height: 1; }
.score .of { color: var(--muted); font-family: var(--f-num); }
.rows { display: grid; gap: 10px; margin-bottom: 26px; }
.row { display: grid; grid-template-columns: 11em minmax(0, 1fr) 5.5em; gap: 12px; align-items: center; font-variant-numeric: tabular-nums; }
.row .meter { height: 10px; }
.row span:last-child { text-align: right; color: var(--muted); font-family: var(--f-num); font-size: .9rem; }
.review { display: grid; gap: 8px; }
.review details { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.review summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; }
.review summary .mk { font-weight: 700; width: 1.2em; flex: none; }
.review summary .mk.y { color: var(--ok); }
.review summary .mk.n { color: var(--bad); }
.review summary .st { min-width: 0; }
.review .inner { padding: 0 14px 14px; display: grid; gap: 12px; }
.weak { display: grid; gap: 8px; }
.weak .w { display: grid; grid-template-columns: minmax(0, 1fr) 6em auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; }
.weak .w .pc { font-family: var(--f-num); text-align: right; font-variant-numeric: tabular-nums; }
.empty { padding: 18px; border: 1px dashed var(--rule); border-radius: 12px; color: var(--muted); }

.palette { display: flex; flex-wrap: wrap; gap: 4px; margin: 18px 0 0; }
.palette button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); font-family: var(--f-num); font-size: .75rem; cursor: pointer; color: var(--muted); }
.palette button.done { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
.palette button.cur { border-color: var(--accent); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.banner { background: var(--sunk); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: .95rem; }
.banner b { display: block; margin-bottom: 2px; }
.pace { font-size: .85rem; color: var(--muted); }
.pace.behind { color: var(--bad); }
.foot { margin-top: 40px; font-size: .85rem; color: var(--muted); max-width: 75ch; }

@media (max-width: 860px) {
  .hero, .qgrid, .guide { grid-template-columns: minmax(0, 1fr); }
  .modes { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: 7.5em minmax(0, 1fr) 4.5em; }
  .weak .w { grid-template-columns: minmax(0, 1fr) auto; }
  .weak .w .pc { display: none; }
  .scale div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="mark" href="#home"><span class="tape" aria-hidden="true"></span><span><b>Watson Glaser Trainer</b><small>Critical thinking appraisal practice</small></span></a>
    <nav class="top" aria-label="Main">
      <a href="#home" data-nav="home">Practise</a>
      <a href="#learn-inference" data-nav="learn">Learn</a>
      <a href="#mock" data-nav="mock">Mock test</a>
      <a href="#progress" data-nav="progress">Progress</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

<script src="content.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
